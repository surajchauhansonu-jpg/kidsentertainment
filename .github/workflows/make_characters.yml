name: Make Characters (ek baar)

on:
  workflow_dispatch:
    inputs:
      names:
        description: "Characters, comma se (jaise Krishna,Arjun,Karna) ya 'all'"
        required: false
        default: "Krishna"
      pick:
        description: "Candidate chuno (generate nahi hoga), jaise Arjun=2,Karna=3"
        required: false
        default: ""
      redo:
        description: "true = jo character pehle se hain unhe dobara banao"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-v1

      - name: Install packages
        run: pip install -r requirements-chars.txt

      - name: Make characters
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAMES: ${{ github.event.inputs.names }}
          PICK: ${{ github.event.inputs.pick }}
          REDO: ${{ github.event.inputs.redo }}
        run: python make_characters.py

      - name: Save characters in repo
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add characters
          git diff --cached --quiet || (git commit -m "characters update" && git push)
