name: Make Video -> Telegram

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (khali chhodo to topics.txt se aayega)"
        required: false
        default: ""
      scenes:
        description: "Scenes (14 = lagbhag 1.5-2 min)"
        required: false
        default: "14"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install python packages
        run: pip install -r requirements.txt

      - name: Generate video and send to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TOPIC: ${{ github.event.inputs.topic }}
          SCENES: ${{ github.event.inputs.scenes || '14' }}
        run: python main.py

      - name: Keep a copy (backup, 7 din)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/
          retention-days: 7

      - name: Telegram pe error batao
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Video banane me error aaya. GitHub > Actions me log dekho."
