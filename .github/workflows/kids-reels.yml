name: Kids Reels

on:
  schedule:
    - cron: "30 1 * * *"   # roz subah 7:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg + Hindi font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Generate reels and send to Telegram
        run: python generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      - name: Save history (repeat se bachne ke liye)
        run: |
          git config user.name "kids-reels-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git commit -m "update history" || true
          git push
